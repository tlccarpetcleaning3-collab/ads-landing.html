# Netlify configuration for TLC Carpet & Upholstery Cleaning
# Domain migration: tlccarpetcleaningil.com → tlccarpetcleaning.com

# Redirect old domain to new domain (301 permanent)
[[redirects]]
  from = "https://tlccarpetcleaningil.com/*"
  to = "https://tlccarpetcleaning.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.tlccarpetcleaningil.com/*"
  to = "https://tlccarpetcleaning.com/:splat"
  status = 301
  force = true

# Redirect www to non-www (canonical)
[[redirects]]
  from = "https://www.tlccarpetcleaning.com/*"
  to = "https://tlccarpetcleaning.com/:splat"
  status = 301
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"
